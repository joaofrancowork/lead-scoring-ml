name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov-report=xml

  train:
    # Trains on the real dataset and fails if the model stops beating the baseline.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run lead-scoring train --split random --features all --out artifacts/model
      - name: Quality gate
        run: |
          uv run python - <<'PY'
          import json
          card = json.load(open("artifacts/model/model_card.json"))
          test = card["test"]
          print(json.dumps(test, indent=2))
          assert test["roc_auc"] > 0.75, "ROC-AUC regressed"
          assert test["lift_at_10"] > 3.0, "lift at top decile regressed"
          PY
      - run: uv run lead-scoring drift > drift.md
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            artifacts/model/
            drift.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lead-scoring:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the API
        run: |
          docker run -d -p 8000:8000 --name api lead-scoring:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/model | head -c 300
