[project]
name = "lead-scoring-ml"
version = "0.1.0"
description = "Lead conversion scoring with scikit-learn: leakage-free features, time-based validation, calibrated probabilities, MLflow tracking and a FastAPI scoring service."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Franco" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "mlflow>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scikit-learn>=1.6",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
lead-scoring = "lead_scoring.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_scoring"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=lead_scoring --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
